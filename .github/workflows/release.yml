name: Release - Signed APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (e.g. 1.9.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK + GitHub Release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare version + paths
        id: prep
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.TrimStart('v').Trim()
          } else {
            $version = '${{ github.ref_name }}'.TrimStart('v').Trim()
          }

          if ($version -notmatch '^(?<major>\d+)\.(?<minor>\d+)(?:\.(?<patch>\d+))?$') {
            throw "Invalid version '$version'. Use a tag like v1.9.0 or pass version=1.9.0."
          }
          $patchPart = if ($Matches['patch']) { [int]$Matches['patch'] } else { 0 }
          $code = ([int]$Matches['major'] * 10000) + ([int]$Matches['minor'] * 100) + $patchPart

          "version=$version"          | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version_code=$code"        | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$version"             | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "apk=NaatPlayer-$version.apk" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Check signing secrets
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          $missing = @()
          foreach ($name in 'KEYSTORE_BASE64', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { $missing += $name }
          }
          if ($missing.Count -gt 0) {
            $list = $missing -join ', '
            Write-Host "::error::Missing GitHub Actions secrets: $list"
            Write-Host "Repo -> Settings -> Secrets and variables -> Actions mein ye secrets add karein, phir ye job re-run karein."
            exit 1
          }
          Write-Host 'All signing secrets present.'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_SDK_ROOT
          if (-not $sdk) { $sdk = $env:ANDROID_HOME }
          if (-not $sdk) { $sdk = 'C:\Android\android-sdk' }
          if (-not (Test-Path $sdk)) { throw "Android SDK not found at $sdk" }
          Write-Host "Android SDK: $sdk"

          $hasPlatform = Get-ChildItem (Join-Path $sdk 'platforms') -Directory -ErrorAction SilentlyContinue |
                         Where-Object { Test-Path (Join-Path $_.FullName 'android.jar') } |
                         Select-Object -First 1
          $buildTools = Get-ChildItem (Join-Path $sdk 'build-tools') -Directory -ErrorAction SilentlyContinue

          if (-not $hasPlatform -or -not $buildTools) {
            $sdkmanager = Get-ChildItem (Join-Path $sdk 'cmdline-tools') -Recurse -Filter 'sdkmanager.bat' -ErrorAction SilentlyContinue |
                          Select-Object -First 1 -ExpandProperty FullName
            if (-not $sdkmanager) { throw 'sdkmanager not found and required SDK packages are missing' }
            ("y`n" * 100) | & $sdkmanager --sdk_root=$sdk --licenses | Out-Null
            & $sdkmanager --sdk_root=$sdk --install 'platforms;android-34' 'build-tools;34.0.0'
            if ($LASTEXITCODE -ne 0) { throw 'sdkmanager install failed' }
          }

          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build signed APK
        shell: pwsh
        env:
          VERSION_NAME: ${{ steps.prep.outputs.version }}
          VERSION_CODE: ${{ steps.prep.outputs.version_code }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          $ksPath = Join-Path $PWD 'release.keystore'
          [IO.File]::WriteAllBytes($ksPath, [Convert]::FromBase64String($env:KEYSTORE_BASE64))

          $env:KEYSTORE_PATH = $ksPath
          $env:KEYSTORE_PASS = $env:KEYSTORE_PASSWORD
          $env:KEY_PASS      = $env:KEY_PASSWORD

          powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed with exit code $LASTEXITCODE" }

          Remove-Item $ksPath -Force

      - name: Verify signature + generate checksum
        shell: pwsh
        run: |
          $apk = '${{ steps.prep.outputs.apk }}'
          $sdk = if ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { $env:ANDROID_HOME }
          $bt = Get-ChildItem (Join-Path $sdk 'build-tools') -Directory |
                Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1

          $output = & (Join-Path $bt.FullName 'apksigner.bat') verify --print-certs $apk 2>&1
          $output | Out-String | Write-Host
          if ($LASTEXITCODE -ne 0) { throw 'APK signature verification failed' }

          $signerLine = $output | Select-String -Pattern 'Signer #1 certificate DN:'
          if (-not $signerLine) { throw 'Could not read the signing certificate from the APK' }
          $signer = $signerLine.ToString().Trim()
          Write-Host $signer

          $hash = (Get-FileHash $apk -Algorithm SHA256).Hash.ToLower()
          "$hash  $apk" | Out-File -FilePath "$apk.sha256" -Encoding ascii
          Write-Host "SHA256: $hash"

          $summary = @"
          ### Signed build
          - Version: **${{ steps.prep.outputs.version }}** (code ${{ steps.prep.outputs.version_code }})
          - $signer
          - SHA256: $hash
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: Naat Player ${{ steps.prep.outputs.version }}
          body: |
            Signed release build of **Naat Player ${{ steps.prep.outputs.version }}** (versionCode `${{ steps.prep.outputs.version_code }}`).

            Commit: `${{ github.sha }}`

            **Install:** neeche se `.apk` download karein aur Android par install karein (unknown sources allow karna hoga).
            Purani install ke upgrade ke liye wahi signing key honi chahiye.
          files: |
            ${{ steps.prep.outputs.apk }}
            ${{ steps.prep.outputs.apk }}.sha256
          fail_on_unmatched_files: true
          make_latest: true
          generate_release_notes: true
