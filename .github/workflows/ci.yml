name: CI - Build APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Ek hi branch/PR ke purane runs cancel kar do
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (debug-signed)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_SDK_ROOT
          if (-not $sdk) { $sdk = $env:ANDROID_HOME }
          if (-not $sdk) { $sdk = 'C:\Android\android-sdk' }
          if (-not (Test-Path $sdk)) { throw "Android SDK not found at $sdk" }
          Write-Host "Android SDK: $sdk"

          $hasPlatform = Get-ChildItem (Join-Path $sdk 'platforms') -Directory -ErrorAction SilentlyContinue |
                         Where-Object { Test-Path (Join-Path $_.FullName 'android.jar') } |
                         Select-Object -First 1
          $buildTools = Get-ChildItem (Join-Path $sdk 'build-tools') -Directory -ErrorAction SilentlyContinue

          if (-not $hasPlatform -or -not $buildTools) {
            $sdkmanager = Get-ChildItem (Join-Path $sdk 'cmdline-tools') -Recurse -Filter 'sdkmanager.bat' -ErrorAction SilentlyContinue |
                          Select-Object -First 1 -ExpandProperty FullName
            if (-not $sdkmanager) { throw 'sdkmanager not found and required SDK packages are missing' }
            ("y`n" * 100) | & $sdkmanager --sdk_root=$sdk --licenses | Out-Null
            & $sdkmanager --sdk_root=$sdk --install 'platforms;android-34' 'build-tools;34.0.0'
            if ($LASTEXITCODE -ne 0) { throw 'sdkmanager install failed' }
          }

          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set CI version
        shell: pwsh
        run: |
          $code = 100 + [int]$env:GITHUB_RUN_NUMBER
          "VERSION_CODE=$code" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION_NAME=2.0.0-ci.$env:GITHUB_RUN_NUMBER" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build APK
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed with exit code $LASTEXITCODE" }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: NaatPlayer-ci-${{ github.sha }}
          path: NaatPlayer-*.apk
          retention-days: 14
          if-no-files-found: error
