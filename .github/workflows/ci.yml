name: CI - Build APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Ek hi branch/PR ke purane runs cancel kar do
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (debug-signed)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        shell: pwsh
        run: |
          $sdk = if ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { $env:ANDROID_HOME }
          $sdkmanager = Join-Path $sdk 'cmdline-tools\latest\bin\sdkmanager.bat'
          if (-not (Test-Path $sdkmanager)) { throw "sdkmanager not found at $sdkmanager" }

          ("y`n" * 50) | & $sdkmanager --licenses | Out-Null
          & $sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'sdkmanager install failed' }

      - name: Build APK
        shell: pwsh
        env:
          VERSION_NAME: '1.9.0'
          VERSION_CODE: ${{ 100 + github.run_number }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed with exit code $LASTEXITCODE" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NaatPlayer-ci-${{ github.sha }}
          path: NaatPlayer-*.apk
          retention-days: 14
          if-no-files-found: error
